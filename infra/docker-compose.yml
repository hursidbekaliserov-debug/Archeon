version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://naqshlab_user:naqshlab_secret@postgres:5432/naqshlab_db?schema=public
      - REDIS_URL=redis://redis:6379
      - WORKER_URL=http://worker:8000
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=naqshlab-assets
      - S3_ACCESS_KEY=naqshlab_minio
      - S3_SECRET_KEY=naqshlab_minio_secret
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - NEXTAUTH_SECRET=naqshlab_super_secret_cookie_key_32chars!
    depends_on:
      - postgres
      - redis
      - minio
      - worker

  worker:
    build:
      context: ../apps/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=naqshlab-assets
      - S3_ACCESS_KEY=naqshlab_minio
      - S3_SECRET_KEY=naqshlab_minio_secret
    depends_on:
      - minio

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=naqshlab_user
      - POSTGRES_PASSWORD=naqshlab_secret
      - POSTGRES_DB=naqshlab_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=naqshlab_minio
      - MINIO_ROOT_PASSWORD=naqshlab_minio_secret
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
  redis_data:
  minio_data:
